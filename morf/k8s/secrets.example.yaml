---
# =============================================================================
# EXAMPLE / TEMPLATE ONLY — DO NOT APPLY AS-IS AND DO NOT COMMIT REAL SECRETS.
# =============================================================================
#
# Every MORF pod (stable + canary, and the `migrate` initContainer) references a
# Secret named `morf-secrets` with keys DATABASE_URL and REDIS_URL via
# secretKeyRef. If that Secret does not exist in the pod's namespace, the
# container never starts — it fails with CreateContainerConfigError and the
# rollout never becomes Ready.
#
# This file provides that Secret in BOTH namespaces (`morf` and `morf-canary`)
# so a fresh cluster can roll out. The VALUES BELOW ARE FAKE PLACEHOLDERS.
#
# HOW TO USE:
#   1. Copy this file (e.g. `cp secrets.example.yaml secrets.local.yaml`).
#   2. Replace every REPLACE_ME_* value with your real connection strings.
#   3. Apply the copy — DO NOT commit it. Add it to .gitignore.
#
# RECOMMENDED (do not ship long-lived plaintext secrets in git at all):
#   - External Secrets Operator  -> sync from AWS Secrets Manager / Vault / GSM.
#     https://external-secrets.io
#   - Sealed Secrets (Bitnami)   -> commit an encrypted SealedSecret; the
#     controller decrypts it in-cluster. https://sealed-secrets.netlify.app
#   With either of those, delete these plaintext Secret objects and let the
#   operator materialize `morf-secrets` in each namespace instead.
#
# DATABASE_URL format: mysql://<user>:<password>@<host>:3306/<db>
# REDIS_URL    format: redis://<host>:6379   (or rediss:// for TLS)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: morf-secrets
  namespace: morf
  labels:
    app: morf
type: Opaque
stringData:
  # FAKE placeholder — replace with your real MySQL DSN before applying.
  DATABASE_URL: "mysql://REPLACE_ME_USER:REPLACE_ME_PASSWORD@mysql-service:3306/morf"
  # FAKE placeholder — replace with your real Redis URL before applying.
  REDIS_URL: "redis://redis-service:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: morf-secrets
  namespace: morf-canary
  labels:
    app: morf
    version: canary
type: Opaque
stringData:
  # FAKE placeholder — replace with your real MySQL DSN before applying.
  # A separate canary DB/schema is recommended so canary migrations cannot
  # affect stable production data.
  DATABASE_URL: "mysql://REPLACE_ME_USER:REPLACE_ME_PASSWORD@mysql-service:3306/morf_canary"
  # FAKE placeholder — replace with your real Redis URL before applying.
  REDIS_URL: "redis://redis-service:6379"
