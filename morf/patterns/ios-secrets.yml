# File-level MASVS control id: default OWASP MASVS tag applied to every pattern
# in this file unless a pattern overrides it with its own `masvs:`.
masvs: MASVS-STORAGE-1
patterns:
  # ---------------------------------------------------------------------------
  # Cross-platform cloud / SaaS credentials commonly embedded in iOS binaries,
  # Info.plist files, and bundled config. All regexes are RE2 (Go regexp) and
  # ripgrep (Rust regex) compatible: no lookaround, no backreferences.
  # ---------------------------------------------------------------------------
  - pattern:
      name: AWS Access Key ID
      regex: "(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
      confidence: high
      enabled: true
  - pattern:
      name: Google API Key
      regex: "AIza[0-9A-Za-z\\-_]{35}"
      confidence: high
      enabled: true
  - pattern:
      name: Google OAuth Client ID (iOS)
      regex: "[0-9]+-[0-9A-Za-z_]{32}\\.apps\\.googleusercontent\\.com"
      confidence: high
      enabled: true
  - pattern:
      name: Google OAuth Access Token
      regex: "ya29\\.[0-9A-Za-z\\-_]+"
      confidence: high
      enabled: true
  - pattern:
      name: Firebase Cloud Messaging Server Key (AAAA)
      regex: "AAAA[A-Za-z0-9_\\-]{7}:[A-Za-z0-9_\\-]{140}"
      confidence: high
      enabled: true
  - pattern:
      name: Firebase Database URL
      regex: "https://[a-z0-9\\-]+\\.firebaseio\\.com"
      confidence: medium
      enabled: true
  - pattern:
      name: Firebase App URL
      regex: "https://[a-z0-9\\-]+\\.firebaseapp\\.com"
      confidence: medium
      enabled: true
  - pattern:
      name: Stripe Live Secret Key
      regex: "sk_live_[0-9a-zA-Z]{24}"
      confidence: high
      enabled: true
  - pattern:
      name: Stripe Restricted Live Key
      regex: "rk_live_[0-9a-zA-Z]{24}"
      confidence: high
      enabled: true
  - pattern:
      name: Slack Token
      regex: "xox[baprs]-[0-9a-zA-Z]{10,48}"
      confidence: high
      enabled: true
  - pattern:
      name: Slack Webhook
      regex: "https://hooks\\.slack\\.com/services/T[a-zA-Z0-9_]{8}/B[a-zA-Z0-9_]{8}/[a-zA-Z0-9_]{24}"
      confidence: high
      enabled: true
  - pattern:
      name: Twilio API Key SID
      regex: "SK[0-9a-f]{32}"
      confidence: high
      enabled: true
  - pattern:
      name: Twilio Account SID
      regex: "AC[0-9a-fA-F]{32}"
      confidence: medium
      enabled: true
  - pattern:
      name: SendGrid API Key
      regex: "SG\\.[A-Za-z0-9_\\-]{22}\\.[A-Za-z0-9_\\-]{43}"
      confidence: high
      enabled: true
  - pattern:
      name: Square Access Token
      regex: "sq0atp-[0-9A-Za-z\\-_]{22}"
      confidence: high
      enabled: true
  - pattern:
      name: Square OAuth Secret
      regex: "sq0csp-[0-9A-Za-z\\-_]{43}"
      confidence: high
      enabled: true
  - pattern:
      name: Mailgun API Key
      regex: "key-[0-9a-zA-Z]{32}"
      confidence: high
      enabled: true
  - pattern:
      name: GitHub Token
      regex: "(ghp|gho|ghu|ghs|ghr)_[0-9a-zA-Z]{36,76}"
      confidence: high
      enabled: true

  # ---------------------------------------------------------------------------
  # Generic bearer tokens, JWTs, and private key material.
  # ---------------------------------------------------------------------------
  - pattern:
      name: Bearer Token
      regex: "[Bb]earer\\s+[A-Za-z0-9\\-._~+/]{20,}={0,2}"
      confidence: medium
      enabled: true
  - pattern:
      name: JSON Web Token (JWT)
      regex: "eyJ[A-Za-z0-9_\\-]+\\.eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+"
      confidence: high
      enabled: true
  - pattern:
      name: Private Key Block
      regex: "-----BEGIN[ A-Z0-9]* PRIVATE KEY-----"
      confidence: high
      enabled: true

  # ---------------------------------------------------------------------------
  # iOS-specific indicators.
  # ---------------------------------------------------------------------------
  # Custom URL schemes registered in Info.plist (CFBundleURLSchemes) that look
  # like OAuth / auth callbacks. Matches the plist array element value.
  - pattern:
      name: iOS OAuth Callback URL Scheme
      regex: "<string>[A-Za-z0-9.\\-]*(oauth|auth|callback|redirect|login|sso)[A-Za-z0-9.\\-]*</string>"
      confidence: medium
      enabled: true
  # Reverse-DNS Google/Firebase OAuth callback scheme used by GoogleSignIn on iOS.
  - pattern:
      name: iOS Google Reversed Client ID Scheme
      regex: "com\\.googleusercontent\\.apps\\.[0-9]+-[0-9A-Za-z_]{32}"
      confidence: high
      enabled: true
  # Facebook login URL scheme embedded in iOS apps: fb<appid>.
  - pattern:
      name: iOS Facebook Login URL Scheme
      regex: "fb[0-9]{13,17}://"
      confidence: medium
      enabled: true
  # Keychain access group identifier: <team-id>.<bundle-id> form in entitlements.
  # Team ID is a 10-char alphanumeric Apple identifier.
  - pattern:
      name: iOS Keychain Access Group
      regex: "[A-Z0-9]{10}\\.[a-zA-Z0-9]+(\\.[a-zA-Z0-9\\-]+)+"
      confidence: low
      enabled: true
  # keychain-access-groups entitlement key present in an embedded plist.
  - pattern:
      name: iOS Keychain Access Groups Entitlement
      regex: "keychain-access-groups"
      confidence: low
      enabled: true
  # NOTE: a bare provisioning-profile UUID is NOT a secret and would match every
  # UUID in the binary/plists (pure noise). Provisioning-profile identification
  # belongs in iOS metadata extraction (embedded.mobileprovision), not the secret
  # scanner, so no bare-UUID pattern is defined here.
  # App Store Connect / TestFlight API key ID (used with .p8 keys). 10-char key ID.
  - pattern:
      name: App Store Connect API Key ID
      regex: "(AuthKey_[A-Z0-9]{10}|APP_STORE_CONNECT_API_KEY_ID)"
      confidence: medium
      enabled: true
  # App Store Connect / TestFlight private key file marker (.p8 EC key).
  - pattern:
      name: App Store Connect Private Key (.p8)
      regex: "-----BEGIN PRIVATE KEY-----"
      confidence: high
      enabled: true
  # Apple push (APNs) auth key reference commonly stored alongside App Store keys.
  - pattern:
      name: Apple Team Identifier Prefix
      regex: "\\$\\(AppIdentifierPrefix\\)"
      confidence: low
      enabled: true
