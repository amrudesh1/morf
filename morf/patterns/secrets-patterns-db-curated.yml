- pattern:
    name: Pubnubpublishkey - 2
    regex: \b(pub-c-[0-9a-z]{8}-[0-9a-z]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{12})\b
    confidence: high
- pattern:
    name: PyPI upload token
    regex: pypi-AgEIcHlwaS5vcmc[A-Za-z0-9-_]{50,1000}
    confidence: high
- pattern:
    name: Razorpay - 1
    regex: \brzp_\w{2,6}_\w{10,20}\b
    confidence: high
- pattern:
    name: Rubygems
    regex: \b(rubygems_[a-zA0-9]{48})\b
    confidence: high
- pattern:
    name: Saucelabs - 1
    regex: \b(oauth\-[a-z0-9]{8,}\-[a-z0-9]{5})\b
    confidence: high
- pattern:
    name: Sendinbluev2
    regex: \b(xkeysib\-[A-Za-z0-9_-]{81})\b
    confidence: high
- pattern:
    name: Shopify access token
    regex: shpat_[a-fA-F0-9]{32}
    confidence: high
- pattern:
    name: Shopify custom app access token
    regex: shpca_[a-fA-F0-9]{32}
    confidence: high
- pattern:
    name: Shopify private app access token
    regex: shppa_[a-fA-F0-9]{32}
    confidence: high
- pattern:
    name: Shopify shared secret
    regex: shpss_[a-fA-F0-9]{32}
    confidence: high
- pattern:
