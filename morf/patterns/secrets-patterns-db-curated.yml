    regex: xoxb-[0-9A-Za-z\-]{51}
    confidence: high
- pattern:
    name: Squareapp - 1
    regex: '[\w\-]*sq0i[a-z]{2}-[0-9A-Za-z\-_]{22,43}'
    confidence: high
- pattern:
    name: Squareapp - 2
    regex: '[\w\-]*sq0c[a-z]{2}-[0-9A-Za-z\-_]{40,50}'
    confidence: high
- pattern:
    name: Squareup
