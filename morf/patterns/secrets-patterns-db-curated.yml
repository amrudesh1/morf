# Curated high-confidence patterns imported from mazen160/secrets-patterns-db (db/rules-stable.yml).
# Curation to REDUCE noise: high-confidence, ANCHORED value patterns (distinctive prefix +
# bounded length) only. Rejected: generic/entropy, keyword-assignment (key=|:), PEM headers,
# bare hostnames, wildcards, dict-word prefixes, and anything MORF already ships. Every regex
# validated against the ripgrep (Rust-regex) engine; unnecessary escapes (\\_ \\/ \\") repaired.
platform: any
patterns:
- pattern:
    name: AWS Access Key ID Value
    regex: (A3T[A-Z0-9]|AKIA|AGPA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}
    confidence: high
- pattern:
    name: Alibaba - 2
    regex: \b(LTAI[a-zA-Z0-9]{17,21})["' ;\s]*
    confidence: high
- pattern:
    name: Apideck - 1
    regex: \b(sk_live_[a-z0-9A-Z-]{93})\b
    confidence: high
- pattern:
    name: Apify
    regex: \b(apify_api_[a-zA-Z-0-9]{36})\b
    confidence: high
- pattern:
    name: Aws - 1
    regex: \b((?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16})\b
    confidence: high
- pattern:
    name: Closecrm
    regex: \b(api_[a-z0-9A-Z.]{45})\b
    confidence: high
- pattern:
    name: Cloudinary Credentials
    regex: cloudinary://[0-9]+:[A-Za-z0-9\-_\.]+@[A-Za-z0-9\-_\.]+
    confidence: high
- pattern:
    name: Databricks
    regex: dapi[a-f0-9]{32}\b
    confidence: high
- pattern:
    name: Discord Webhook
    regex: https://discordapp\.com/api/webhooks/[0-9]+/[A-Za-z0-9\-]+
    confidence: high
- pattern:
    name: Discordwebhook
    regex: (https://discord.com/api/webhooks/[0-9]{18}/[0-9a-zA-Z-]{68})
    confidence: high
- pattern:
    name: Finage
    regex: \b(API_KEY[0-9A-Z]{32})\b
    confidence: high
- pattern:
    name: Fleetbase
    regex: \b(flb_live_[0-9a-zA-Z]{20})\b
    confidence: high
- pattern:
    name: Flutterwave
    regex: \b(FLWSECK-[0-9a-z]{32}-X)\b
    confidence: high
- pattern:
    name: Frameio
    regex: \b(fio-u-[0-9a-zA-Z_-]{64})\b
    confidence: high
- pattern:
    name: Gcp
    regex: \{[^{]+auth_provider_x509_cert_url[^}]+\}
    confidence: high
- pattern:
    name: Github OAuth Access Token
    regex: gho_[0-9a-zA-Z]{36}
    confidence: high
- pattern:
    name: Github Personal Access Token
    regex: ghp_[0-9a-zA-Z]{36}
    confidence: high
- pattern:
    name: Github Refresh Token
    regex: ghr_[0-9a-zA-Z]{76}
    confidence: high
- pattern:
    name: Gitlabv2
    regex: \b(glpat-[a-zA-Z0-9\-=_]{20,22})\b
    confidence: high
- pattern:
    name: Gocardless
    regex: \b(live_[0-9A-Za-z_\-]{40}[ "'\r\n]{1})
    confidence: high
- pattern:
    name: JDBC Connection String
    regex: jdbc:[a-z:]+://[A-Za-z0-9\.\-_:;=/@?,&]+
    confidence: high
- pattern:
    name: Linearapi
    regex: \b(lin_api_[0-9A-Za-z]{40})\b
    confidence: high
- pattern:
    name: Microsoftteamswebhook
    regex: (https://[a-zA-Z-0-9]+\.webhook\.office\.com/webhookb2/[a-zA-Z-0-9]{8}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{12}@[a-zA-Z-0-9]{8}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{12}/IncomingWebhook/[a-zA-Z-0-9]{32}/[a-zA-Z-0-9]{8}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{4}-[a-zA-Z-0-9]{12})
    confidence: high
- pattern:
    name: Newrelic Admin API Key
    regex: NRAA-[a-f0-9]{27}
    confidence: high
- pattern:
    name: Newrelic REST API Key
    regex: NRRA-[a-f0-9]{42}
    confidence: high
- pattern:
    name: Newrelic Synthetics Location Key
    regex: NRSP-[a-z]{2}[0-9]{2}[a-f0-9]{31}
    confidence: high
- pattern:
    name: Notion
    regex: \b(secret_[A-Za-z0-9]{43})\b
    confidence: high
- pattern:
    name: Posthog
    regex: \b(phc_[a-zA-Z0-9_]{43})\b
    confidence: high
- pattern:
    name: Postman
    regex: \b(PMAK-[a-zA-Z-0-9]{59})\b
