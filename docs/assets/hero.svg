<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD8EF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.16" cy="0.4" r="0.4">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="16" fill="url(#glowL)"/>
  <rect width="1280" height="420" rx="16" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="16" fill="none" stroke="#243045" stroke-opacity="0.9"/>

  <!-- ── Left: brand + value prop ── -->
  <g transform="translate(72,84)">
    <rect x="0" y="0" width="290" height="30" rx="15" fill="#111C30" stroke="#2563EB" stroke-opacity="0.55"/>
    <circle cx="20" cy="15" r="4" fill="#3FB950"/>
    <text x="38" y="20" fill="#9FB0CC" font-size="13" letter-spacing="2">MOBILE RECON · APK + IPA</text>

    <text x="-5" y="132" fill="url(#wordmark)" font-size="108" font-weight="800" letter-spacing="-5">MORF</text>
    <text x="2" y="168" fill="#64748B" font-size="14.5" letter-spacing="5.5">MOBILE RECONNAISSANCE FRAMEWORK</text>

    <!-- editorial accent bar + value prop -->
    <rect x="0" y="196" width="3" height="92" rx="1.5" fill="url(#blue)"/>
    <text x="20" y="222" fill="#E8EEF9" font-size="27" font-weight="700">Every build hides <tspan fill="#60A5FA">something</tspan>.</text>
    <text x="20" y="256" fill="#93A4C0" font-size="16">Find the secret in the app you <tspan fill="#CBD5E1">ship</tspan> —</text>
    <text x="20" y="280" fill="#93A4C0" font-size="16">prove it's <tspan fill="#3FB950" font-weight="700">live</tspan>, map it to MASVS, gate the build.</text>
  </g>

  <!-- ── Right: terminal scan mock ── -->
  <g transform="translate(716,92)">
    <rect x="2" y="4" width="492" height="236" rx="13" fill="#000000" opacity="0.28"/>
    <rect x="0" y="0" width="492" height="236" rx="12" fill="#0B1220" stroke="#26344B"/>
    <rect x="0" y="0" width="492" height="36" rx="12" fill="#0F1A2E"/>
    <rect x="0" y="24" width="492" height="12" fill="#0F1A2E"/>
    <circle cx="22" cy="18" r="5.5" fill="#FF5F56"/>
    <circle cx="43" cy="18" r="5.5" fill="#FFBD2E"/>
    <circle cx="64" cy="18" r="5.5" fill="#27C93F"/>
    <text x="246" y="22" fill="#5B6B83" font-size="12" text-anchor="middle" letter-spacing="0.5">morf — scan</text>
    <line x1="0" y1="36" x2="492" y2="36" stroke="#1B2740"/>

    <text x="22" y="72" font-size="14.5"><tspan fill="#3FB950">$</tspan> <tspan fill="#DCE4F0">morf scan app.apk --verify --fail-on=verified</tspan></text>
    <rect x="430" y="61" width="9" height="15" rx="1.5" fill="#3FB950" opacity="0.85"/>
    <text x="22" y="100" font-size="13.5" fill="#647B98">▸ decompile · 281 detectors · precision engine</text>

    <text x="22" y="134" font-size="13.5"><tspan fill="#F87171">●</tspan> <tspan fill="#E8EEF9">AWS key</tspan>  <tspan fill="#F87171" font-weight="700">LIVE</tspan>  <tspan fill="#5B6B83">MASVS-STORAGE-1</tspan></text>
    <text x="22" y="158" font-size="13.5"><tspan fill="#FBBF24">●</tspan> <tspan fill="#E8EEF9">Stripe</tspan>   <tspan fill="#94A3B8">inactive</tspan>  <tspan fill="#5B6B83">keep</tspan></text>
    <text x="22" y="182" font-size="13.5"><tspan fill="#60A5FA">●</tspan> <tspan fill="#E8EEF9">SBOM</tspan>     <tspan fill="#94A3B8">42 components · 3 CVE</tspan></text>

    <rect x="22" y="198" width="118" height="26" rx="6" fill="#3B0D0D" stroke="#7F1D1D"/>
    <text x="34" y="215" font-size="13" fill="#FCA5A5" font-weight="700">gate: FAIL</text>
    <text x="152" y="215" font-size="13" fill="#F27070">1 new live secret</text>
    <text x="470" y="215" font-size="12.5" fill="#5B6B83" text-anchor="end">exit 4</text>
  </g>

  <!-- baseline accent + strapline -->
  <rect x="72" y="374" width="1136" height="2" rx="1" fill="url(#blue)" opacity="0.75"/>
  <text x="72" y="399" fill="#5B6B83" font-size="12.5" letter-spacing="1">detected · verified · gated — one binary · SARIF 2.1.0 · CycloneDX 1.6 · 5× BlackHat Arsenal</text>
</svg>
