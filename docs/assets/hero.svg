<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="16" fill="none" stroke="#1E293B" stroke-opacity="0.8"/>

  <!-- ── Left: brand + value prop ── -->
  <g transform="translate(72,86)">
    <rect x="0" y="0" width="290" height="30" rx="15" fill="#1E293B" stroke="#2563EB" stroke-opacity="0.5"/>
    <circle cx="20" cy="15" r="4" fill="#3FB950"/>
    <text x="38" y="20" fill="#93A4C0" font-size="13" letter-spacing="2">MOBILE RECON · APK + IPA</text>

    <text x="-4" y="128" fill="#F8FAFC" font-size="104" font-weight="800" letter-spacing="-4">MORF</text>
    <text x="2" y="164" fill="#64748B" font-size="15" letter-spacing="6">MOBILE RECONNAISSANCE FRAMEWORK</text>

    <text x="0" y="220" fill="#E2E8F0" font-size="27" font-weight="700">Every build hides <tspan fill="#60A5FA">something</tspan>.</text>
    <text x="0" y="256" fill="#94A3B8" font-size="16">Find the secret in the app you ship —</text>
    <text x="0" y="280" fill="#94A3B8" font-size="16">prove it's <tspan fill="#3FB950" font-weight="700">live</tspan>, map it to MASVS, gate the build.</text>
  </g>

  <!-- ── Right: terminal scan mock ── -->
  <g transform="translate(720,96)">
    <rect x="0" y="0" width="488" height="228" rx="12" fill="#0B1220" stroke="#243045"/>
    <rect x="0" y="0" width="488" height="34" rx="12" fill="#111C30"/>
    <rect x="0" y="22" width="488" height="12" fill="#111C30"/>
    <circle cx="20" cy="17" r="5" fill="#FF5F56"/>
    <circle cx="40" cy="17" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="17" r="5" fill="#27C93F"/>
    <text x="244" y="21" fill="#5B6b83" font-size="12" text-anchor="middle">morf — scan</text>

    <text x="20" y="66" font-size="14.5"><tspan fill="#3FB950">$</tspan> <tspan fill="#CBD5E1">morf scan app.apk --verify --fail-on=verified</tspan></text>
    <text x="20" y="96" font-size="13.5" fill="#64748B">▸ decompile · 281 detectors · precision engine</text>

    <text x="20" y="128" font-size="13.5"><tspan fill="#F87171">●</tspan> <tspan fill="#E2E8F0">AWS key</tspan>  <tspan fill="#F87171" font-weight="700">LIVE</tspan>  <tspan fill="#5B6b83">MASVS-STORAGE-1</tspan></text>
    <text x="20" y="152" font-size="13.5"><tspan fill="#FBBF24">●</tspan> <tspan fill="#E2E8F0">Stripe</tspan>   <tspan fill="#94A3B8">inactive</tspan>  <tspan fill="#5B6b83">keep</tspan></text>
    <text x="20" y="176" font-size="13.5"><tspan fill="#60A5FA">●</tspan> <tspan fill="#E2E8F0">SBOM</tspan>     <tspan fill="#94A3B8">42 components · 3 CVE</tspan></text>

    <rect x="20" y="192" width="210" height="24" rx="6" fill="#3B0D0D" stroke="#7F1D1D"/>
    <text x="32" y="209" font-size="13" fill="#FCA5A5" font-weight="700">gate: FAIL — 1 new live secret</text>
    <text x="250" y="209" font-size="12.5" fill="#5B6b83">exit 4</text>
  </g>

  <!-- baseline accent -->
  <rect x="72" y="372" width="1136" height="2" rx="1" fill="url(#blue)" opacity="0.7"/>
  <text x="72" y="398" fill="#5B6b83" font-size="12.5" letter-spacing="1">detected · verified · gated — one binary · SARIF 2.1.0 · CycloneDX 1.6 · 5× BlackHat Arsenal</text>
</svg>
