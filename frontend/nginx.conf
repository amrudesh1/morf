error_log /dev/stdout debug;
access_log /dev/stdout combined;

# Allow-list of known frontend origins for CORS. Any origin not listed maps to
# an empty string, which makes nginx omit the Access-Control-Allow-Origin header
# entirely, so unknown origins are not granted cross-origin access.
map $http_origin $cors_allow_origin {
    default                 "";
    "http://localhost"      "http://localhost";
    "http://localhost:4200" "http://localhost:4200";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Increase upload size limit
    client_max_body_size 900M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API proxy with increased timeouts
    location /api/ {
        proxy_pass http://morf-backend:9092/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Increase timeouts
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;

        # CORS headers (single source of truth). Allow-Origin is echoed back
        # only for known frontend origins via the $cors_allow_origin map; an
        # unknown origin yields an empty value and nginx omits the header.
        # All are declared `always`, so they are also applied to the 204
        # preflight response below without being re-declared (re-declaring them
        # inside the if-block previously produced duplicate CORS headers).
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Vary' 'Origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Max-Age' 1728000 always;

        # Handle preflight requests. No add_header here on purpose: an add_header
        # inside this if-block would suppress inheritance of the CORS headers
        # above, so the `always` headers are what get applied to the 204.
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Angular routes handling
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static files caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    # Error handling
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
