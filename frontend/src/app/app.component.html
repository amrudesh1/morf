<div class="relative min-h-screen overflow-hidden bg-ink text-bone">
  <!-- Global scan error banner. Replaces blocking alert() dialogs; driven by
       ScanService.scanError$ and dismissible by the user. Styled as a struck
       oxblood classification bar in the dossier voice. -->
  <div
    *ngIf="scanError"
    role="alert"
    class="fixed top-0 left-0 right-0 z-50 flex items-start justify-between gap-4 border-b border-oxblood bg-ink-900 px-4 py-3 shadow-lg"
  >
    <div class="flex flex-col gap-1">
      <span class="eyebrow text-oxblood">Scan interrupted</span>
      <span class="font-mono text-sm text-bone">{{ scanError }}</span>
    </div>
    <button
      type="button"
      class="font-mono text-lg leading-none text-bone-dim transition-colors hover:text-signal"
      aria-label="Dismiss error"
      (click)="dismissError()"
    >
      &times;
    </button>
  </div>

  <div [@screenAnimation]="currentScreen" class="w-full h-full">
    <ng-container [ngSwitch]="currentScreen">
      <!-- Splash Screen -->
      <app-splash-screen *ngSwitchCase="'splash'"></app-splash-screen>

      <!-- Upload Screen -->
      <app-upload-screen *ngSwitchCase="'upload'"></app-upload-screen>

      <!-- Processing Screen -->
      <app-processing-screen *ngSwitchCase="'processing'"></app-processing-screen>

      <!-- Results Screen -->
      <app-results-screen *ngSwitchCase="'results'"></app-results-screen>

      <!-- Pattern Management Screen -->
      <app-pattern-management *ngSwitchCase="'patterns'"></app-pattern-management>
    </ng-container>
  </div>
</div>
