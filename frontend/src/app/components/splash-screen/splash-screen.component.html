<div class="fixed inset-0 overflow-hidden bg-ink text-bone" [@fadeInOut]>
  <!-- Case-file title card -->
  <div class="absolute inset-0 flex items-center justify-center px-6 z-10">
    <div class="title-card w-full max-w-2xl">

      <!-- Top classification header: eyebrow + document control code -->
      <div class="flex items-center justify-between gap-4 mb-6">
        <span class="eyebrow">Case file</span>
        <!-- decoded control code (matrix effect, mono) -->
        <span class="matrix-code font-mono text-xs text-bone-dim" aria-hidden="true">
          <span *ngFor="let char of matrixChars">{{char}}</span>
        </span>
      </div>

      <hr class="case-rule mb-8">

      <!-- Wordmark -->
      <h1 class="wordmark font-display uppercase leading-none">MORF</h1>

      <!-- Eyebrow: the framework name, decoded in mono (matrix effect) -->
      <p class="eyebrow framework-text mt-4" aria-label="Mobile Reconnaissance Framework">
        <span *ngFor="let char of frameworkMatrixChars">{{char}}</span>
      </p>

      <!-- The signature: a struck classification bar -->
      <div class="mt-10">
        <span class="stamp stamp--muted classification-bar">Classified · Reconnaissance</span>
      </div>

      <hr class="case-rule mt-10 mb-4">

      <!-- Footer control line -->
      <div class="flex items-center justify-between font-mono text-xs text-bone-dim">
        <span>MORF - Mobile Reconnaissance Framework</span>
        <span>v1.0.0</span>
      </div>
    </div>
  </div>

  <!-- Ambient dossier grain / index ticks (retains particle bindings, kept quiet) -->
  <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
    <span *ngFor="let particle of particlePositions"
          class="index-tick"
          [ngStyle]="{
            'top': particle.top,
            'left': particle.left,
            '--delay': particle.delay
          }">
    </span>
  </div>
</div>
