stages:
  - build
  - test
  - security
  - analyze
  - deploy

variables:
  DOCKER_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
  DOCKER_IMAGE_LATEST: "${CI_REGISTRY_IMAGE}:latest"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Build stage
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - cd morf
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST -f Dockerfile .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
  only:
    - branches
    - tags

# Unit tests
unit_tests:
  stage: test
  image: golang:1.21.7
  before_script:
    - cd morf
    - go mod download
  script:
    - echo "Running unit tests..."
    - go test -v -race -coverprofile=coverage.out ./...
    - go tool cover -html=coverage.out -o coverage.html
  coverage: '/total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: morf/coverage.xml
    paths:
      - morf/coverage.html
      - morf/coverage.out
    expire_in: 30 days
  only:
    - branches
    - merge_requests

# Integration tests
integration_tests:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-compose
    - cd morf
  script:
    - echo "Starting services for integration tests..."
    - docker-compose up -d redis mysql
    - sleep 10
    - echo "Running integration tests..."
    - go test -v ./tests/integration_test.go -tags=integration
  after_script:
    - docker-compose down
  only:
    - branches
    - merge_requests

# Performance tests
performance_tests:
  stage: test
  image: golang:1.21.7
  before_script:
    - cd morf
    - go mod download
  script:
    - echo "Running performance benchmarks..."
    - go test -bench=. -benchmem ./tests/performance_test.go
  artifacts:
    paths:
      - morf/benchmark-results.txt
    expire_in: 7 days
  only:
    - main
    - tags

# SAST - Static Application Security Testing
sast:
  stage: security
  image: 
    name: returntocorp/semgrep:latest
    entrypoint: [""]
  script:
    - echo "Running SAST scan..."
    - semgrep --config=auto --json --output=semgrep-results.json morf/
    - semgrep --config=auto --text morf/
  artifacts:
    reports:
      sast: semgrep-results.json
    paths:
      - semgrep-results.json
    expire_in: 30 days
  allow_failure: true
  only:
    - branches
    - merge_requests

# Dependency vulnerability scanning
dependency_scan:
  stage: security
  image: golang:1.21.7
  before_script:
    - cd morf
    - go mod download
  script:
    - echo "Scanning dependencies for vulnerabilities..."
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec -fmt json -out gosec-report.json ./...
    - gosec ./...
  artifacts:
    reports:
      sast: gosec-report.json
    paths:
      - gosec-report.json
    expire_in: 30 days
  allow_failure: true
  only:
    - branches
    - merge_requests

# Container image scanning
container_scan:
  stage: security
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Scanning container image..."
    - docker pull $DOCKER_IMAGE || true
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format json --output trivy-report.json $DOCKER_IMAGE
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $DOCKER_IMAGE
  artifacts:
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
    expire_in: 30 days
  allow_failure: true
  only:
    - branches
    - tags

# Code quality analysis
code_quality:
  stage: analyze
  image: golang:1.21.7
  before_script:
    - cd morf
    - go mod download
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
  script:
    - echo "Running code quality checks..."
    - golangci-lint run --out-format=json --out=golangci-report.json ./...
    - golangci-lint run ./...
  artifacts:
    paths:
      - morf/golangci-report.json
    expire_in: 30 days
  allow_failure: true
  only:
    - branches
    - merge_requests

# APK analysis job (manual trigger)
analyze_apk:
  stage: analyze
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache curl
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Analyzing APK file..."
    - curl -L "$APK_URL" -o app.apk || echo "APK_URL not set, skipping download"
    - docker run --rm -v "$CI_PROJECT_DIR":/data $DOCKER_IMAGE_LATEST morf scan --apk /data/app.apk --output /data/results.json || echo "APK analysis completed"
  artifacts:
    when: always
    paths:
      - results.json
      - app.apk
    expire_in: 7 days
  when: manual
  only:
    - branches

# Deploy to staging
deploy_staging:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache kubectl
    - kubectl version --client
  script:
    - echo "Deploying to staging..."
    - kubectl set image deployment/morf morf=$DOCKER_IMAGE -n morf-staging
    - kubectl rollout status deployment/morf -n morf-staging
  environment:
    name: staging
    url: https://morf-staging.example.com
  only:
    - develop

# Deploy to production (manual)
deploy_production:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache kubectl
    - kubectl version --client
  script:
    - echo "Deploying to production..."
    - kubectl set image deployment/morf morf=$DOCKER_IMAGE -n morf-production
    - kubectl rollout status deployment/morf -n morf-production
  environment:
    name: production
    url: https://morf.example.com
  when: manual
  only:
    - main
    - tags
