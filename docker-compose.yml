services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: morf-mysql
    environment:
      # Credentials come from a non-committed .env file (see .env.example), with
      # LOCAL-DEVELOPMENT-only fallbacks so `docker compose up` works out of the
      # box. Real deployments MUST set these in .env or via Docker secrets.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-morf_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-morf}
      MYSQL_USER: ${MYSQL_USER:-morf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-morf_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # NOTE: migrations are applied by the app at runtime (morf/db/db.go),
      # so they must NOT also be fed to MySQL's initdb.d (which would run an
      # incomplete set against an empty schema in the wrong phase).
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"${MYSQL_ROOT_PASSWORD:-morf_root_password}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morf-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis for Job Queue
  redis:
    image: redis:7-alpine
    container_name: morf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morf-network

  # MORF Backend
  morf-backend:
    build:
      context: ./morf
      dockerfile: Dockerfile
    container_name: morf-backend
    ports:
      - "9092:9092"
    environment:
      # DATABASE_URL is built from the SAME MYSQL_* vars as the mysql service so
      # they stay the single source of truth: set MYSQL_USER / MYSQL_PASSWORD /
      # MYSQL_DATABASE (in .env or the environment) and both services agree. The
      # nested ${VAR:-default} interpolation means editing MYSQL_PASSWORD alone no
      # longer silently mis-auths the backend. Set DATABASE_URL explicitly only to
      # point at a DB that is NOT this compose's mysql service.
      # CAVEAT: this DSN is assembled by raw substitution — DSN-special characters
      # in MYSQL_PASSWORD (e.g. @ : / ? or whitespace) are NOT URL-escaped and will
      # corrupt the connection string. Keep the compose password DSN-safe, or set
      # a fully-escaped DATABASE_URL yourself.
      - DATABASE_URL=${DATABASE_URL:-${MYSQL_USER:-morf}:${MYSQL_PASSWORD:-morf_password}@tcp(mysql:3306)/${MYSQL_DATABASE:-morf}?charset=utf8mb4&parseTime=True&loc=Local}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MORF_GIN_MODE=${MORF_GIN_MODE:-debug}
      # SEC: mask secret values in the /results JSON API by default (see
      # router/routers.go). Set MORF_MASK_RESULTS=false only in trusted setups.
      - MORF_MASK_RESULTS=${MORF_MASK_RESULTS:-true}
      # Persist uploaded artifacts on the ./morf/uploads bind mount below. The
      # local storage backend defaults to /tmp/morf/uploads (ephemeral); pointing
      # it at /app/uploads is what makes that mount actually carry data.
      - MORF_UPLOAD_DIR=${MORF_UPLOAD_DIR:-/app/uploads}
    volumes:
      # Uploaded artifacts survive container restarts via this mount (paired with
      # MORF_UPLOAD_DIR=/app/uploads above). Logs are intentionally NOT mounted:
      # the app writes structured logs to stderr, captured by the json-file driver.
      - ./morf/uploads:/app/uploads
      - ./morf/patterns:/app/patterns
      - ./morf/db/migrations:/app/db/migrations
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Readiness gate for the frontend's depends_on. The debian-slim runtime image
    # has no curl, so we probe with wget, which morf/Dockerfile installs into the
    # runtime stage precisely for this check. /api/ready reports 200 only once
    # Redis (and the DB, if configured) are reachable — see router/routers.go.
    # start_period covers migrate + first boot.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9092/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - morf-network
    # Resource limits for macOS compatibility
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    # Security options (seccomp profile + no privilege escalation)
    security_opt:
      - seccomp:./morf/seccomp/seccomp-apktool.json
      - no-new-privileges:true
    # Drop all Linux capabilities for the untrusted-APK sandbox. If the
    # container fails to start, add back only the specific caps it needs.
    cap_drop:
      - ALL
    # Resource limits per container
    mem_limit: 8g
    mem_reservation: 2g
    cpus: 4.0
    # File descriptor and process limits
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc:
        soft: 512
        hard: 1024
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Frontend (Angular)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: morf-frontend
    ports:
      - "80:80"
    # Wait for the backend to pass its healthcheck (not merely start), so nginx
    # doesn't proxy to a backend that is still migrating or connecting to deps.
    depends_on:
      morf-backend:
        condition: service_healthy
    networks:
      - morf-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Bound resources so a runaway nginx can't starve the host.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  morf-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
