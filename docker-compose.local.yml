# Local development override for macOS
# This file extends docker-compose.yml with macOS-specific optimizations
services:
  morf-backend:
    # Apple Silicon: build and run a NATIVE arm64 image. The Dockerfile defaults
    # to amd64 (for CI/buildx); a plain `docker build` on an M-series Mac would
    # otherwise produce an emulated amd64 binary that can SIGSEGV in runtime.netpoll.
    # `platform` forces arm64 at runtime; the build arg forces the Go cross-compile
    # target to match. buildx multi-arch releases still override both.
    platform: linux/arm64
    build:
      args:
        TARGETARCH: arm64
    # macOS-specific volume mounts for better performance. The ./morf/log mount is
    # intentionally omitted (logs go to stderr, not files).
    volumes:
      - ./morf/uploads:/app/uploads:cached
      - ./morf/patterns:/app/patterns:cached
      - ./morf/db/migrations:/app/db/migrations:cached
    # Enable hot reload for development (if using air or similar)
    # environment:
    #   - AIR_WORKSPACE=/app

  mysql:
    # macOS-specific MySQL configuration
    platform: linux/amd64  # Use x86_64 for better compatibility
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
      --innodb_buffer_pool_size=512M

